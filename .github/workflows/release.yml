name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.7
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      # flutter analyze 在 3.47.7 的 LSP 包装器上会崩溃，统一用 dart analyze。
      - name: Analyze
        run: dart analyze

      - name: Test
        run: flutter test

      - name: Install Android NDK and CMake
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "ndk;28.2.13676358" "cmake;3.22.1"

      # 缺少签名密钥时直接失败：绝不能把 debug 签名的包当成正式版发出去。
      - name: Restore signing config
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ] || [ -z "$KEY_PASSWORD" ] || [ -z "$KEY_ALIAS" ]; then
            echo "Android signing secrets are required (ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_PASSWORD, ANDROID_KEY_ALIAS)." >&2
            echo "Refusing to build a debug-signed release." >&2
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/release.jks
          cat > android/key.properties <<EOF
          storePassword=$KEYSTORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=release.jks
          EOF

      - name: Build release APK
        run: flutter build apk --release --split-per-abi --target-platform android-arm,android-arm64 --split-debug-info=build/symbols

      - name: Package release assets
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          OUT="build/app/outputs/flutter-apk"

          # 应用内更新器按这个文件名约定查找正式包（arm64 为默认包）。
          cp "$OUT/app-arm64-v8a-release.apk" "Zync-release-${VERSION}.apk"
          cp "$OUT/app-armeabi-v7a-release.apk" "Zync-release-${VERSION}-armeabi-v7a.apk"
          sha256sum "Zync-release-${VERSION}.apk" > "Zync-release-${VERSION}.apk.sha256"

          if [ -d build/symbols ]; then
            (cd build/symbols && zip -qr "../../Zync-symbols-${VERSION}.zip" .)
          fi

          ls -lh Zync-release-* Zync-symbols-* 2>/dev/null || true

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            Zync-release-*.apk
            Zync-release-*.apk.sha256
            Zync-symbols-*.zip
