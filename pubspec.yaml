name: zync
description: "Zync - Pro Nikon Z-Series Wireless Tethering, Transfer & Watermark Studio"
publish_to: 'none'
version: 2.5.1+13

environment:
  sdk: '>=3.13.0 <4.0.0'
  flutter: ">=3.44.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  animations: ^2.0.11
  archive: ^4.3.0
  flutter_svg: ^2.0.9
  image: ^4.1.7
  exif: ^3.3.0
  crypto: ^3.0.3
  intl: ^0.20.3
  path_provider: ^2.1.2
  video_player: ^2.9.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/licenses/spektrafilm-GPL-3.0.txt
    - assets/licenses/spektrafilm-CC-BY-SA-4.0.txt
    - assets/icons/zync_logo.svg
    - assets/icons/zync_logo.png
    - assets/samples/pc_preview/
    - assets/recipes/timor88/
    - assets/recipes/creators/
    - third_party/spektrafilm_native/data/profiles/
    - third_party/spektrafilm_native/data/spectral_constants.json
    - third_party/spektrafilm_native/data/irradiance_xy_tc.npy
    - third_party/spektrafilm_native/data/neutral_print_filters.json
    - third_party/spektrafilm_native/data/output_gamut_srgb.bin
    - third_party/spektrafilm_native/data/output_gamut_srgb.json
    - third_party/spektrafilm_native/data/raw_luts/
