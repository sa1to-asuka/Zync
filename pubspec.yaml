name: zync
description: "Zync - Pro Nikon Z-Series Wireless Tethering, Transfer & Watermark Studio"
publish_to: 'none'
version: 2.2.1+5

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  animations: ^2.0.11
  archive: any
  flutter_svg: ^2.0.9
  image: ^4.1.7
  exif: ^3.3.0
  crypto: ^3.0.3
  intl: any
  path_provider: ^2.1.2
  video_player: ^2.9.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/icons/zync_logo.svg
    - assets/icons/zync_logo.png
    - assets/samples/pc_preview/
    - assets/recipes/timor88/
    - assets/recipes/creators/
